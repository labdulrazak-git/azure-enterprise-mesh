name: CI/CD Workload Delivery

# 1. Trigger the pipeline every time code is pushed to the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'  # Only fire if files inside the app folder change

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    # 2. Checkout the repository code onto the GitHub build runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. Log into Azure securely using GitHub Repository Secrets
    - name: Azure Container Registry Login
      uses: azure/docker-login@v2
      with:
        login-server: la2026mesh.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Set up the Docker Buildx engine for compiling multi-stage builds
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Compile the non-privileged NGINX image and push it to Azure
    - name: Build and Push Workload Image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        tags: la2026mesh.azurecr.io/cloudapp:v1
        cache-from: type=gha
        cache-to: type=gha,mode=max